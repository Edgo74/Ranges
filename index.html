<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range dans le range</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="data.js"></script>
<style>
  :root { --bg:#ffffff; --panel:#f6f7f9; --border:#e3e6eb; --text:#16191e; --muted:#6b7380; --green:#15803d; --red:#b91c1c; --amber:#b45309; --orange:#f59e0b; --blue:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --panel:#161a20; --border:#262c36; --text:#e2e6ec; --muted:#7d8794; --green:#4ade80; --red:#f87171; --amber:#fbbf24; --blue:#60a5fa; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .f { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--border); }
  select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sum { font-size: 12px; color: var(--muted); } .sum b { color: var(--text); }
  .list { overflow-y: auto; flex: 1; }
  .it { padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px; }
  .it:hover { background: var(--bg); } .it.sel { box-shadow: inset 3px 0 0 var(--blue); background: var(--bg); }
  .it .d { color: var(--muted); font-size: 11px; }
  .win { color: var(--green); } .loss { color: var(--red); } .open { color: var(--amber); }
  main { display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 16px; }
  .kv span { display: block; font-size: 11px; color: var(--muted); } .kv b { font-variant-numeric: tabular-nums; }
  #chart { flex: 1; min-height: 0; position: relative; }
  .vote { display: flex; gap: 6px; margin-left: auto; }
  .vote button { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  .vote button.on.yes { background: #dcfce7; border-color: var(--green); color: #14532d; }
  .vote button.on.no { background: #fee2e2; border-color: var(--red); color: #7f1d1d; }
  .legend { padding: 6px 16px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); display: flex; gap: 16px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
  .btn { border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 6px; border-radius: 6px; cursor: pointer; font: inherit; }
  .hint { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="f">
      <div class="row">
        <select id="fTf"><option value="">Tous TF</option></select>
        <select id="fCoin"><option value="">Tous coins</option></select>
      </div>
      <div class="row">
        <select id="fRes"><option value="">Tous résultats</option><option value="win">✓ réussis</option><option value="loss">✗ ratés</option><option value="en cours">en cours</option></select>
        <select id="fVote"><option value="">Tous</option><option value="none">Pas encore jugés</option><option value="yes">Jugés « oui »</option><option value="no">Jugés « non »</option></select>
      </div>
      <div class="sum" id="sum"></div>
    </div>
    <div class="list" id="list"></div>
    <div class="f" style="border-top:1px solid var(--border);border-bottom:0">
      <button class="btn" id="exp">Exporter mes jugements</button>
      <div class="hint">← → : signal précédent / suivant · O : c'est le motif · N : ce n'est pas le motif</div>
    </div>
  </aside>
  <main>
    <header id="hdr"></header>
    <div id="chart"></div>
    <div class="legend">
      <span><span class="sw" style="background:#f59e0b"></span>grand range (haut / bas)</span>
      <span><span class="sw" style="background:#8b5cf6"></span>petit range</span>
      <span><span class="sw" style="background:#2563eb;height:8px;width:3px"></span>flèche = moment du signal</span>
      <span>Réussi = bord opposé touché avant que le prix dépasse le bord du petit range de 50 % de la hauteur du range</span>
    </div>
  </main>
</div>
<script>
const SIG = window.SIGNALS || [], CH = window.CHARTS || {};
const $ = s => document.querySelector(s);
const st = { tf: "", coin: "", res: "", vote: "", sel: null };
let votes = {}; try { votes = JSON.parse(localStorage.getItem("rr-votes") || "{}"); } catch (e) {}
const key = s => `${s.coin}|${s.tf}|${s.t}`;
const saveVotes = () => { try { localStorage.setItem("rr-votes", JSON.stringify(votes)); } catch (e) {} };
const tz = t => t - new Date(t * 1000).getTimezoneOffset() * 60;
const dt = t => new Date(t * 1000).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const RES = { win: ["✓ réussi", "win"], loss: ["✗ raté", "loss"], "en cours": ["en cours", "open"], ambigu: ["ambigu", "open"] };

[...new Set(SIG.map(s => s.tf))].forEach(v => $("#fTf").insertAdjacentHTML("beforeend", `<option>${v}</option>`));
[...new Set(SIG.map(s => s.coin))].sort().forEach(v => $("#fCoin").insertAdjacentHTML("beforeend", `<option>${v}</option>`));

function filtered() {
  return SIG.filter(s => (!st.tf || s.tf === st.tf) && (!st.coin || s.coin === st.coin) && (!st.res || s.out.result === st.res)
    && (!st.vote || (st.vote === "none" ? !votes[key(s)] : votes[key(s)] === st.vote))).sort((a, b) => b.t - a.t);
}
function renderList() {
  const r = filtered();
  const w = r.filter(s => s.out.result === "win").length, l = r.filter(s => s.out.result === "loss").length;
  const vy = r.filter(s => votes[key(s)] === "yes"), vyw = vy.filter(s => s.out.result === "win").length, vyl = vy.filter(s => s.out.result === "loss").length;
  $("#sum").innerHTML = `<b>${r.length}</b> signaux · ✓ <b>${w}</b> · ✗ <b>${l}</b>${w + l ? ` · réussite <b>${Math.round(w / (w + l) * 100)} %</b>` : ""}`
    + (vy.length ? `<br>Parmi ceux que tu as validés : ✓ ${vyw} · ✗ ${vyl}${vyw + vyl ? ` (${Math.round(vyw / (vyw + vyl) * 100)} %)` : ""}` : "");
  $("#list").innerHTML = r.map(s => `<div class="it ${st.sel === s.id ? "sel" : ""}" data-id="${s.id}">
    <div><b>${s.coin}</b> ${s.tf} · <span class="${s.dir === "short" ? "loss" : "win"}">${s.dir}</span> ${votes[key(s)] === "yes" ? "👍" : votes[key(s)] === "no" ? "👎" : ""}</div>
    <div class="${RES[s.out.result][1]}">${RES[s.out.result][0]}</div>
    <div class="d">${dt(s.t)} · petit range en ${s.side === "top" ? "haut" : "bas"}</div>
    <div class="d" style="text-align:right">${s.out.bars} bougies</div></div>`).join("") || '<div class="hint" style="padding:12px">Aucun signal</div>';
  return r;
}
$("#list").onclick = e => { const it = e.target.closest(".it"); if (it) select(+it.dataset.id); };

let chart;
function select(id) {
  st.sel = id; renderList();
  document.querySelector(`.it[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
  const s = SIG.find(x => x.id === id), bars = CH[id];
  const v = votes[key(s)];
  $("#hdr").innerHTML = `<h1>${s.coin} · ${s.tf}</h1>
    <div class="kv"><span>Signal</span><b>${dt(s.t)}</b></div>
    <div class="kv"><span>Direction</span><b class="${s.dir === "short" ? "loss" : "win"}">${s.dir.toUpperCase()} (petit range en ${s.side === "top" ? "haut" : "bas"})</b></div>
    <div class="kv"><span>Touches haut / bas</span><b>${s.touchesTop} / ${s.touchesBot}</b></div>
    <div class="kv"><span>Résultat</span><b class="${RES[s.out.result][1]}">${RES[s.out.result][0]} en ${s.out.bars} bougies</b></div>
    <div class="vote"><span class="hint" style="align-self:center">C'est le motif ?</span>
      <button class="yes ${v === "yes" ? "on" : ""}" data-v="yes">Oui</button><button class="no ${v === "no" ? "on" : ""}" data-v="no">Non</button></div>`;
  $("#hdr .vote").onclick = e => { const b = e.target.closest("button"); if (b) vote(s, b.dataset.v); };
  draw(s, bars);
}
function vote(s, v) { votes[key(s)] = votes[key(s)] === v ? undefined : v; if (!votes[key(s)]) delete votes[key(s)]; saveVotes(); select(s.id); }

function draw(s, bars) {
  if (chart) chart.remove();
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  chart = LightweightCharts.createChart($("#chart"), {
    autoSize: true,
    layout: { background: { color: dark ? "#0f1216" : "#ffffff" }, textColor: dark ? "#7d8794" : "#6b7380" },
    grid: { vertLines: { color: dark ? "#1a1f27" : "#f0f1f4" }, horzLines: { color: dark ? "#1a1f27" : "#f0f1f4" } },
    timeScale: { timeVisible: true, secondsVisible: false }, crosshair: { mode: 0 },
  });
  // barres OHLC (comme ton graphique en ticks)
  const ser = chart.addBarSeries({ upColor: "#16a34a", downColor: dark ? "#e5e7eb" : "#111827", thinBars: false, openVisible: true });
  ser.setData(bars.map(b => ({ time: tz(b[0]), open: b[1], high: b[2], low: b[3], close: b[4] })));
  const seg = (t0, t1, p, color, w = 2, style = 0) => {
    const l = chart.addLineSeries({ color, lineWidth: w, lineStyle: style, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false });
    l.setData([{ time: tz(t0), value: p }, { time: tz(t1), value: p }]);
  };
  const tEnd = s.out.t || s.t;
  seg(s.tStart, tEnd, s.H, "#f59e0b"); seg(s.tStart, tEnd, s.L, "#f59e0b");
  seg(s.tInner, s.t, s.ih, "#8b5cf6", 2); seg(s.tInner, s.t, s.il, "#8b5cf6", 2);
  ser.setMarkers([
    { time: tz(s.t), position: s.dir === "short" ? "aboveBar" : "belowBar", color: "#2563eb", shape: s.dir === "short" ? "arrowDown" : "arrowUp", text: "signal" },
    ...(s.out.t ? [{ time: tz(s.out.t), position: "inBar", color: s.out.result === "win" ? "#16a34a" : "#dc2626", shape: "circle", text: s.out.result === "win" ? "✓" : "✗" }] : []),
  ]);
  chart.timeScale().fitContent();
}

$("#fTf").onchange = e => { st.tf = e.target.value; refresh(); };
$("#fCoin").onchange = e => { st.coin = e.target.value; refresh(); };
$("#fRes").onchange = e => { st.res = e.target.value; refresh(); };
$("#fVote").onchange = e => { st.vote = e.target.value; refresh(); };
function refresh() { const r = renderList(); if (r.length && !r.find(s => s.id === st.sel)) select(r[0].id); }
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  const r = filtered(), i = r.findIndex(s => s.id === st.sel), s = r[i];
  if (["ArrowDown", "ArrowRight"].includes(e.key) && i < r.length - 1) select(r[i + 1].id);
  if (["ArrowUp", "ArrowLeft"].includes(e.key) && i > 0) select(r[i - 1].id);
  if (s && e.key.toLowerCase() === "o") vote(s, "yes");
  if (s && e.key.toLowerCase() === "n") vote(s, "no");
});
$("#exp").onclick = () => {
  const out = SIG.filter(s => votes[key(s)]).map(s => ({ coin: s.coin, tf: s.tf, t: s.t, vote: votes[key(s)], result: s.out.result }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  a.download = "jugements-range.json"; a.click();
};
refresh();
</script>
</body>
</html>
